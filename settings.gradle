pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://maven.wagyourtail.xyz/releases" }
        maven { url = "https://maven.wagyourtail.xyz/snapshots" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal() {
            content { excludeGroup("org.apache.logging.log4j") }
        }
    }
}

plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "0.8.0"
}

rootProject.name = 'lookatit'

include '1.7.10'
include '1.8.9'
include '1.12.2'
include '1.20.1-Forge'
include '1.20.1-Fabric'
include '1.21.1-NeoForge'
include '26.1.2-NeoForge'
include '26.2-NeoForge'
include '26.3-NeoForge'
include 'installer'
include 'universal-common'
include 'universal-forge1710'
include 'universal-forgelegacy'
include 'universal-neoforge'
include 'universal-fabric'
include 'universal'
