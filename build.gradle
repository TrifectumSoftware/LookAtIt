def uploadCurseForge(String projectId, String token, File file, Map entry, String releaseType) {
    def boundary = '----lookatit' + System.currentTimeMillis()
    def metadata = groovy.json.JsonOutput.toJson([
            changelog       : 'Initial release.',
            changelogType   : 'markdown',
            displayName     : entry.name,
            gameVersionNames: [entry.mc, entry.cfLoader, 'Client', 'Server'],
            releaseType     : releaseType
    ])
    def body = multipartBody(boundary, [
            [name: 'metadata', filename: null, contentType: 'application/json', bytes: metadata.getBytes('UTF-8')],
            [name: 'file', filename: file.name, contentType: 'application/java-archive', bytes: file.bytes]
    ])
    def response = postMultipart("https://minecraft.curseforge.com/api/projects/${projectId}/upload-file", token, boundary, body, 'X-Api-Token')
    println "Uploaded ${file.name}: ${response}"
}

def uploadModrinth(String projectId, String token, File file, Map entry, String versionType) {
    def boundary = '----lookatit' + System.currentTimeMillis()
    def metadata = groovy.json.JsonOutput.toJson([
            project_id    : projectId,
            name          : entry.name,
            version_number: "1.0.0+${entry.mc}-${entry.mrLoader}",
            changelog     : 'Initial release.',
            dependencies  : [],
            game_versions : [entry.mc],
            version_type  : versionType,
            loaders       : [entry.mrLoader],
            file_parts    : ['file']
    ])
    def body = multipartBody(boundary, [
            [name: 'data', filename: null, contentType: 'application/json', bytes: metadata.getBytes('UTF-8')],
            [name: 'file', filename: file.name, contentType: 'application/java-archive', bytes: file.bytes]
    ])
    def response = postMultipart("https://api.modrinth.com/v2/version", token, boundary, body, 'Authorization', 'Bearer ')
    println "Uploaded ${file.name}: ${response}"
}

def multipartBody(String boundary, List<Map> parts) {
    def body = new ByteArrayOutputStream()
    parts.each { part ->
        body.write("--${boundary}\r\n".getBytes('UTF-8'))
        def disposition = "Content-Disposition: form-data; name=\"${part.name}\""
        if (part.filename != null) disposition += "; filename=\"${part.filename}\""
        body.write((disposition + "\r\n").getBytes('UTF-8'))
        body.write("Content-Type: ${part.contentType}\r\n\r\n".getBytes('UTF-8'))
        body.write(part.bytes)
        body.write("\r\n".getBytes('UTF-8'))
    }
    body.write("--${boundary}--\r\n".getBytes('UTF-8'))
    return body.toByteArray()
}

def postMultipart(String url, String token, String boundary, byte[] body, String authHeader, String authPrefix = '') {
    def connection = new URL(url).openConnection()
    connection.requestMethod = 'POST'
    connection.doOutput = true
    connection.setRequestProperty(authHeader, authPrefix + token)
    connection.setRequestProperty('User-Agent', 'trifectumsoftware/lookatit-uploader/1.0.0')
    connection.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")
    connection.setFixedLengthStreamingMode(body.length)
    connection.outputStream.withStream { it.write(body) }
    def code = connection.responseCode
    def response = code >= 200 && code < 300 ? connection.inputStream.text : connection.errorStream?.text
    if (code < 200 || code >= 300) {
        throw new GradleException("Upload failed (${code}) for ${url}: ${response}")
    }
    return response
}
