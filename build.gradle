def uploadJars = [
        [project: ':1.7.10', jar: 'LookAtIt-1.7.10-1.0.0.jar', name: 'LookAtIt 1.0.0 (1.7.10 Forge)', mc: '1.7.10', cfLoader: 'Forge', mrLoader: 'forge'],
        [project: ':1.8.9', jar: 'LookAtIt-1.8.9-1.0.0.jar', name: 'LookAtIt 1.0.0 (1.8.9 Forge)', mc: '1.8.9', cfLoader: 'Forge', mrLoader: 'forge'],
        [project: ':1.12.2', jar: 'LookAtIt-1.12.2-1.0.0.jar', name: 'LookAtIt 1.0.0 (1.12.2 Forge)', mc: '1.12.2', cfLoader: 'Forge', mrLoader: 'forge'],
        [project: ':1.20.1-Forge', jar: 'LookAtIt-1.20.1-Forge-1.0.0.jar', name: 'LookAtIt 1.0.0 (1.20.1 Forge)', mc: '1.20.1', cfLoader: 'Forge', mrLoader: 'forge'],
        [project: ':1.20.1-Fabric', jar: 'LookAtIt-1.20.1-Fabric-1.0.0.jar', name: 'LookAtIt 1.0.0 (1.20.1 Fabric)', mc: '1.20.1', cfLoader: 'Fabric', mrLoader: 'fabric'],
        [project: ':1.21.1-NeoForge', jar: 'LookAtIt-1.21.1-NeoForge-1.0.0.jar', name: 'LookAtIt 1.0.0 (1.21.1 NeoForge)', mc: '1.21.1', cfLoader: 'NeoForge', mrLoader: 'neoforge'],
        [project: ':26.1.2-NeoForge', jar: 'LookAtIt-26.1.2-NeoForge-1.0.0.jar', name: 'LookAtIt 1.0.0 (26.1.2 NeoForge)', mc: '26.1.2', cfLoader: 'NeoForge', mrLoader: 'neoforge'],
        [project: ':26.2-NeoForge', jar: 'LookAtIt-26.2-NeoForge-1.0.0.jar', name: 'LookAtIt 1.0.0 (26.2 NeoForge)', mc: '26.2', cfLoader: 'NeoForge', mrLoader: 'neoforge'],
        [project: ':26.3-NeoForge', jar: 'LookAtIt-26.3-NeoForge-1.0.0.jar', name: 'LookAtIt 1.0.0 (26.3 NeoForge)', mc: '26.3', cfLoader: 'NeoForge', mrLoader: 'neoforge']
]

def uploadDepends = [
        ':1.7.10:jar', ':1.8.9:jar', ':1.12.2:jar',
        ':1.20.1-Forge:jar', ':1.20.1-Fabric:remapJar',
        ':1.21.1-NeoForge:jar', ':26.1.2-NeoForge:jar',
        ':26.2-NeoForge:jar', ':26.3-NeoForge:jar'
]

def jarFile = { entry -> file("${entry.project.substring(1)}/build/libs/${entry.jar}") }

def selectedJars = { only, skip ->
    uploadJars.findAll { entry ->
        (!only || entry.name.contains(only)) && (!skip || !entry.name.contains(skip))
    }
}

tasks.register('curseforgeUploadAll') {
    dependsOn uploadDepends

    doLast {
        def projectFile = file('curseforge.project')
        def tokenFile = file('curseforge.token')
        def projectId = System.getenv('CURSEFORGE_PROJECT_ID') ?: findProperty('curseforgeProjectId') ?: (projectFile.isFile() ? projectFile.text.trim() : null)
        def token = System.getenv('CURSEFORGE_TOKEN') ?: findProperty('curseforgeToken') ?: (tokenFile.isFile() ? tokenFile.text.trim() : null)
        def dryRun = (System.getenv('CURSEFORGE_DRY_RUN') ?: findProperty('curseforgeDryRun')) == 'true'
        def releaseType = System.getenv('CURSEFORGE_RELEASE_TYPE') ?: 'release'
        def only = System.getenv('CURSEFORGE_ONLY') ?: findProperty('curseforgeOnly')
        def skip = System.getenv('CURSEFORGE_SKIP') ?: findProperty('curseforgeSkip')

        if (!dryRun && (!projectId || !token)) {
            throw new GradleException('Set CURSEFORGE_PROJECT_ID and CURSEFORGE_TOKEN, or run with -PcurseforgeDryRun=true.')
        }

        def failures = []
        selectedJars(only, skip).each { entry ->
            def target = jarFile(entry)
            if (!target.isFile()) {
                failures << "Missing ${target}"
                return
            }
            if (dryRun) {
                println "Would upload ${target.name} as '${entry.name}' for ${entry.mc} ${entry.cfLoader}"
                return
            }
            try {
                uploadCurseForge(projectId, token, target, entry, releaseType)
            } catch (Exception e) {
                failures << e.message
                println "FAILED ${target.name}: ${e.message}"
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("CurseForge uploads failed:\n" + failures.join("\n"))
        }
    }
}

