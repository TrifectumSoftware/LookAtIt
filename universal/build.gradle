plugins {
    id 'java'
}

group = 'trifectumsoftware'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

tasks.register('universalJar', Jar) {
    dependsOn ':universal-common:classes',
            ':universal-forge1710:classes',
            ':universal-forgelegacy:patchForgeLegacyClass',
            ':universal-neoforge:classes',
            ':universal-fabric:classes',
            ':1.7.10:jar', ':1.8.9:jar', ':1.12.2:jar',
            ':1.20.1-Forge:jar', ':1.20.1-Fabric:remapJar',
            ':1.21.1-NeoForge:jar', ':26.1.2-NeoForge:jar',
            ':26.2-NeoForge:jar', ':26.3-NeoForge:jar'

    archiveFileName = 'lookatit-universal.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')

    from(project(':universal-common').layout.buildDirectory.dir('classes/java/main'))
    from(project(':universal-forge1710').layout.buildDirectory.dir('classes/java/main')) {
        include 'trifectumsoftware/lookatit/universal/forge1710/**'
    }
    from(project(':universal-forgelegacy').layout.buildDirectory.dir('patched')) {
        include 'ForgeLegacyEntry.class'
        into 'trifectumsoftware/lookatit/universal/forgelegacy'
    }
    from(project(':universal-neoforge').layout.buildDirectory.dir('classes/java/main')) {
        include 'trifectumsoftware/lookatit/universal/neoforge/**'
    }
    from(project(':universal-fabric').layout.buildDirectory.dir('classes/java/main')) {
        include 'trifectumsoftware/lookatit/universal/fabric/**'
    }

    from sourceSets.main.output

    from(project(':1.7.10').layout.buildDirectory.dir('libs')) {
        include 'lookatit-1.7.10-*.jar'
        into 'mods'
        rename { 'lookatit-1.7.10-Forge.jar' }
    }
    from(project(':1.8.9').layout.buildDirectory.dir('libs')) {
        include 'lookatit-1.8.9-*.jar'
        into 'mods'
        rename { 'lookatit-1.8.9-Forge.jar' }
    }
    from(project(':1.12.2').layout.buildDirectory.dir('libs')) {
        include 'lookatit-1.12.2-*.jar'
        into 'mods'
        rename { 'lookatit-1.12.2-Forge.jar' }
    }
    from(project(':1.20.1-Forge').layout.buildDirectory.dir('libs')) {
        include 'lookatit-1.20.1-Forge-*.jar'
        into 'mods'
        rename { 'lookatit-1.20.1-Forge.jar' }
    }
    from(project(':1.20.1-Fabric').layout.buildDirectory.dir('libs')) {
        include 'lookatit-1.20.1-Fabric-*.jar'
        exclude '*-dev.jar'
        into 'mods'
        rename { 'lookatit-1.20.1-Fabric.jar' }
    }
    from(project(':1.21.1-NeoForge').layout.buildDirectory.dir('libs')) {
        include 'lookatit-1.21.1-NeoForge-*.jar'
        into 'mods'
        rename { 'lookatit-1.21.1-NeoForge.jar' }
    }
    from(project(':26.1.2-NeoForge').layout.buildDirectory.dir('libs')) {
        include 'lookatit-26.1.2-NeoForge-*.jar'
        into 'mods'
        rename { 'lookatit-26.1.2-NeoForge.jar' }
    }
    from(project(':26.2-NeoForge').layout.buildDirectory.dir('libs')) {
        include 'lookatit-26.2-NeoForge-*.jar'
        into 'mods'
        rename { 'lookatit-26.2-NeoForge.jar' }
    }
    from(project(':26.3-NeoForge').layout.buildDirectory.dir('libs')) {
        include 'lookatit-26.3-NeoForge-*.jar'
        into 'mods'
        rename { 'lookatit-26.3-NeoForge.jar' }
    }
}

tasks.named('assemble') {
    dependsOn 'universalJar'
}
